[package]
name = "maw-provider-ollama"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Local-model provider for MAW: a coding-agent loop over an Ollama server's /api/chat"

[dependencies]
maw-core.workspace = true
async-trait.workspace = true
futures.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
rmcp = { version = "3.8", features = ["client", "transport-streamable-http-client-reqwest"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile = "3"
maw-storage.workspace = true
maw-orchestrator.workspace = true
maw-mcp.workspace = true
